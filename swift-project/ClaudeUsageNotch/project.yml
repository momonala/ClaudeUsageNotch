name: ClaudeUsageNotch
options:
  bundleIdPrefix: com.claudeusagenotch
  # Matches the -target passed by scripts/build.sh (arm64-apple-macosx26.0),
  # which is what actually ships. At 12.0 the test target failed to compile at
  # all — UsageChartView's Charts axis builders need 13.0 — so `xcodebuild
  # test` could never run against the same code the app is built from.
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.claudeusagenotch.ClaudeUsageNotch
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""  # Set to your 10-char Apple Team ID before notarizing: https://developer.apple.com/account
    ENABLE_HARDENED_RUNTIME: YES
    INFOPLIST_FILE: Sources/Resources/Info.plist
    CODE_SIGN_ENTITLEMENTS: Sources/Resources/ClaudeUsageNotch.entitlements
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

targets:
  ClaudeUsageNotch:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "Resources/Info.plist"
          - "Resources/ClaudeUsageNotch.entitlements"
    resources:
      - path: Sources/Resources/Assets.xcassets
      - path: Sources/Resources/BrandIcons
    info:
      path: Sources/Resources/Info.plist
      properties:
        CFBundleName: ClaudeUsageNotch
        CFBundleDisplayName: Claude Usage Notch
        CFBundleIdentifier: com.claudeusagenotch.ClaudeUsageNotch
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "12.0"
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ClaudeUsageNotchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: ClaudeUsageNotch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Xcode's generated Info.plist defaults NSPrincipalClass to
        # NSApplication for a macOS bundle, so XCTestDriver instantiates a
        # *second* NSApplication inside the host app and AppKit traps
        # ("More than one NSApplication instance was created") before any test
        # runs. Blanking it leaves the host's own singleton alone.
        INFOPLIST_KEY_NSPrincipalClass: ""
